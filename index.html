*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:12px}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95rem}
h1{font-size:1.05rem;margin:0;font-weight:600;letter-spacing:-.01em}
h1 span{color:var(--muted);font-weight:400}
.sub{font-size:.74rem;color:var(--muted);margin-top:1px}
.meter{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--muted)}
.bar{width:90px;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;width:90%;background:var(--accent);transition:width .5s}
#log{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-direction:column;max-width:80%}
.row.me{align-self:flex-end;align-items:flex-end}
.who{font-size:.68rem;color:var(--muted);margin-bottom:3px;letter-spacing:.03em}
.msg{padding:10px 14px;border-radius:8px;line-height:1.5;font-size:.93rem;white-space:pre-wrap;background:var(--bot)}
.me .msg{background:var(--me);color:var(--meink)}
.typing span{display:inline-block;width:6px;height:6px;margin:0 2px;background:var(--muted);border-radius:50%;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
form{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
input{flex:1;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{padding:0 20px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:500;font-size:.92rem;cursor:pointer}
button:disabled{opacity:.5}
.hint{font-size:.68rem;color:var(--muted);text-align:center;padding:0 12px 12px}
</style>
</head>

  const s=t.toLowerCase().trim();
  if(!s)return'leer';
  if(/^(hi|hallo|hey|moin|servus|guten (tag|abend)|huhu)/.test(s))return'hallo';
  if(/wie geht|wie läuft|alles gut/.test(s))return'wie';
  if(/(\bpi\b|π|kreiszahl)/.test(s))return'pi';
  if(/prim/.test(s))return'prim';
  if(/pythagoras|hypotenuse|a²|a\^2/.test(s))return'pyth';
  if(/durch (0|null)|\/\s*0\b|unendlich/.test(s))return'null';
  if(/danke|dankeschön|merci/.test(s))return'danke';
  if(/bitte/.test(s))return'bitte';
  if(/tschüss|tschuess|bye|ciao|auf wiedersehen/.test(s))return'bye';
  if(/witz|lustig|lach/.test(s))return'witz';
  if(/hilf|hilfe|kannst du mir/.test(s))return'hilf';
  if(/wer bist|was bist du/.test(s))return'wer';
  if(/nige/.test(s))return'nige';
  if(/lange nacht|nacht/.test(s))return'nacht';
  if(/\d/.test(s))return'zahl';
  if(/mathe|rechne|gleichung|ableit|integral|wurzel|bruch|prozent|formel|beweis|dreieck|kreis|zahl|summe|ergebnis|lösung/.test(s))return'mathe';
  if(/^(warum|wieso|weshalb)/.test(s))return'warum';
  return Math.random()<.35?'mathe':'rand';
}
function add(text,cls){
  const r=document.createElement('div');r.className='row '+(cls.includes('me')?'me':'bot');
  const w=document.createElement('div');w.className='who';w.textContent=cls.includes('me')?'Sie':'Weissig AI';
  const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;
  r.append(w,d);log.appendChild(r);log.scrollTop=log.scrollHeight;return r;
}
function setLevel(){
  annoy=Math.min(10,1+Math.floor(count/2)+(count>3?1:0));
  const k=100-annoy*10;fill.style.width=k+'%';lvl.textContent=k+' %';
}
function reply(t){
  count++;setLevel();
  let r;
  if(annoy>=10&&Math.random()<.5)r=maxed[Math.floor(Math.random()*maxed.length)];
  else if(count%5===0)r=extra[Math.floor(Math.random()*extra.length)].replace('{n}',count).replace('{k}',100-annoy*10);
  else r=pick(classify(t));
  if(r===last)r=pick('rand');
  const w=(t.match(/[A-Za-zÄÖÜäöüß]{4,}/g)||[]).sort((a,b)=>b.length-a.length)[0];
  if(w&&Math.random()<.3&&annoy<10)r=pick('echo').replace('{w}',w);
  else if(Math.random()<.25)r=openers[Math.floor(Math.random()*openers.length)]+' '+r;
  else if(Math.random()<.2)r=r+' '+closers[Math.floor(Math.random()*closers.length)];
  last=r;
  if(annoy>=8&&Math.random()<.5)r=r.toUpperCase();
  return r;
}
form.addEventListener('submit',e=>{
  e.preventDefault();
  const t=inp.value.trim();
  if(!t)return;
  add(t,'me');inp.value='';btn.disabled=true;
  const ty=add('','bot typing');ty.querySelector('.msg').innerHTML='<span></span><span></span><span></span>';
  setTimeout(()=>{ty.remove();add(reply(t),'bot');btn.disabled=false;inp.focus();},700+Math.random()*900);
});
add('Guten Abend. Ich bin Weissig AI. Ich stehe Ihnen für Ihre Anliegen zur Verfügung. Leider. Was wollen Sie?','bot');
</script>
