*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:12px}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95rem}
h1{font-size:1.05rem;margin:0;font-weight:600;letter-spacing:-.01em}
h1 span{color:var(--muted);font-weight:400}
.sub{font-size:.74rem;color:var(--muted);margin-top:1px}
.meter{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--muted)}
.bar{width:90px;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;width:90%;background:var(--accent);transition:width .5s}
#log{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-direction:column;max-width:80%}
.row.me{align-self:flex-end;align-items:flex-end}
.who{font-size:.68rem;color:var(--muted);margin-bottom:3px;letter-spacing:.03em}
.msg{padding:10px 14px;border-radius:8px;line-height:1.5;font-size:.93rem;white-space:pre-wrap;background:var(--bot)}
.me .msg{background:var(--me);color:var(--meink)}
.typing span{display:inline-block;width:6px;height:6px;margin:0 2px;background:var(--muted);border-radius:50%;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
form{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
input{flex:1;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{padding:0 20px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:500;font-size:.92rem;cursor:pointer}
button:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px 0}.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.75rem;cursor:pointer}.chip:hover{color:var(--ink);border-color:var(--accent)}
.hint{font-size:.68rem;color:var(--muted);text-align:center;padding:0 12px 12px}
</style>
</head>

function classify(t){
  const s=t.toLowerCase().trim();
  if(!s)return'leer';
  if(/^(hi|hallo|hey|moin|servus|guten (tag|abend)|huhu)/.test(s))return'hallo';
  if(/wie geht|wie läuft|alles gut/.test(s))return'wie';
  if(/(\bpi\b|π|kreiszahl)/.test(s))return'pi';
  if(/prim/.test(s))return'prim';
  if(/pythagoras|hypotenuse|a²|a\^2/.test(s))return'pyth';
  if(/durch (0|null)|\/\s*0\b|unendlich/.test(s))return'null';
  if(/danke|dankeschön|merci/.test(s))return'danke';
  if(/bitte/.test(s))return'bitte';
  if(/tschüss|tschuess|bye|ciao|auf wiedersehen/.test(s))return'bye';
  if(/witz|lustig|lach/.test(s))return'witz';
  if(/hilf|hilfe|kannst du mir/.test(s))return'hilf';
  if(/wer bist|was bist du/.test(s))return'wer';
  if(/nige/.test(s))return'nige';
  if(/lange nacht|nacht/.test(s))return'nacht';
  if(/\d/.test(s))return'zahl';
  if(/mathe|rechne|gleichung|ableit|integral|wurzel|bruch|prozent|formel|beweis|dreieck|kreis|zahl|summe|ergebnis|lösung/.test(s))return'mathe';
  if(/^(warum|wieso|weshalb)/.test(s))return'warum';
  return Math.random()<.35?'mathe':'rand';
}

function analyze(t){
  const s=t.toLowerCase().trim();
  const words=t.match(/[A-Za-zÄÖÜäöüß]{3,}/g)||[];
  const key=words.filter(w=>!STOP.has(w.toLowerCase())).sort((a,b)=>b.length-a.length);
  const nums=t.match(/\d+(?:[.,]\d+)?/g)||[];
  const m=s.match(/(\d+(?:[.,]\d+)?)\s*(\+|-|−|\*|×|x|·|\/|:|÷|\^|plus|minus|mal|geteilt durch|durch|hoch)\s*(\d+(?:[.,]\d+)?)/);
  const letters=t.replace(/[^A-Za-zÄÖÜäöüß]/g,'');
  const c={s,key,nums,
    expr:m?{a:m[1],o:OPN[m[2]],b:m[3]}:null,
    shout:letters.length>=6&&letters===letters.toUpperCase(),
    long:t.length>140,
    short:t.length<=2&&!nums.length,
    eng:/\b(the|what|how|why|hello|please|thanks|you|can you|is it)\b/.test(s)&&!/\b(ist|und|ich|der|die|das|was)\b/.test(s),
    repeat:!!user.prev&&norm(t)===user.prev,
    insult:/dumm|doof|blöd|nervig|nervst|scheiß|idiot|nutzlos|schrott|schlecht/.test(s),
    praise:/\b(toll|super|cool|klasse|lieb|geil|genial|schlau|klug)\b|mag dich/.test(s),
    topic:TOPICS.findIndex(x=>x[0].test(s)),
    name:(t.match(/(?:[Ii]ch hei[ßs]e|[Mm]ein [Nn]ame ist|[Nn]enn mich|[Ii]ch bin)\s+([A-ZÄÖÜ][a-zäöüß]{1,})/)||[])[1]||null,
    q:/^(was ist|was sind|was bedeutet|was heißt|erkläre|erklär)/.test(s)?'qwas':/^wie\b/.test(s)?'qwie':/^wer\b/.test(s)?'qwer':/^wo\b/.test(s)?'qwo':/^wann\b/.test(s)?'qwann':/^(kannst|könntest|kann|könnt|würdest)/.test(s)?'qkann':/^(ist|sind|hat|haben|gibt|stimmt|darf|muss|soll)\b/.test(s)?'qjn':/\?\s*$/.test(s)?'qfrage':null
  };
  return c;
}

function ext(t,c){
  const s=c.s;
  c.safe=/suizid|selbstmord|umbringen|töte mich|nicht mehr leben|leben beenden|sterben will|sterben möchte|ritzen|selbstverletz|nicht mehr da sein/.test(s);
  c.sorry=/sorry|entschuldig|tut mir leid|verzeih/.test(s);
  c.sad=/traurig|einsam|gestresst|\bstress|\bangst|wütend|überfordert|deprim|schlecht drauf|weinen|mobbing/.test(s);
  c.happy=/glücklich|\bfroh|freu mich|aufgeregt|toller tag|bestanden|gewonnen|geschafft/.test(s);
  c.botq=BOTQ.find(x=>x[0].test(s));
  c.cmd=/^(erzähl|sag|zeig|gib|schreib|mach|rechne|berechne|löse|erkläre|nenn|liste|spiel|sing|zähl|beweis|finde|such)/.test(s)?s.split(/\s+/)[0]:null;
  c.inter=/^(ja|jo|jep|nein|nö|nee|ok|okay|ach so|hm+|lol|haha|ha ha|xd|krass|wow|echt|oh|aha|stimmt|genau|klar|doch|ne|joa|mhm|na ja|naja)\W*$/.test(s);
  c.idk=/keine ahnung|weiß nicht|weiss nicht|\bka\b|idk|keine idee/.test(s);
  c.stmt=/^ich\s/.test(s)&&!/\?/.test(s)&&t.length>=8&&t.length<=90;
  c.deci=(/0[.,]25(?!\d)/.test(s)&&/0[.,]025(?!\d)/.test(s))||(/0[.,]0?25(?!\d)/.test(s)&&/kleiner|größer|grösser|mehr als|weniger als/.test(s));
  c.dec=/\d[,.]\d/.test(s)&&/kleiner|größer|grösser|vergleich|mehr als|weniger als/.test(s);
  c.s67=/(^|[^\d,.])67($|[^\d])/.test(s)||/six\s?seven|sixseven|sechs[\s-]*sieben|\b6\s?[-–]\s?7\b/.test(s);
  c.noise=/halt.*klappe|klappe|leise|\bruhe\b|quatsch|zu laut|reden/.test(s);
  c.has42=c.nums.includes('42');
  c.afterQ=user.asked&&t.trim().split(/\s+/).length<=5;
}

function core(t,c){
  ext(t,c);
  const w=c.key[0];
  if(c.safe){c.safeHit=true;return R.safe[0];}
  if(c.deci){count=Math.max(count,16);setLevel();return pick('rage');}
  if(c.dec&&Math.random()<.8)return pick('dec');
  if(c.repeat)return pick('repeat');
  if(c.afterQ&&Math.random()<.8)return pick('afterQ');
  if(c.name){user.name=c.name;return pick('nameIn').replace('{name}',c.name);}
  if(c.expr){
    if(Math.random()<.4)return rnd(EXOP[c.expr.o]);
    return pick('expr').replace('{a}',c.expr.a).replace('{b}',c.expr.b).replace('{o}',c.expr.o);
  }
  if(c.s67){if(Math.random()<.5)return pick('s67f');count+=2;setLevel();return pick('s67a');}
  if(c.has42&&Math.random()<.75)return pick('num42');
  if(c.noise&&Math.random()<.7)return pick('liebevoll');
  if(c.shout)return pick('shout');
  if(c.sorry){user.bonus=Math.min(2,(user.bonus||0)+1);setLevel();return pick('sorry');}
  if(c.sad){c.safeHit=true;return pick('sad');}
  if(c.happy)return pick('happy');
  if(c.botq)return rnd(c.botq[1]);
  if(c.cmd&&Math.random()<.8)return pick('cmd').replace('{v}',c.cmd);
  if(c.topic>=0&&Math.random()<.88)return pick('top'+c.topic);
  if(c.insult)return pick('insult');
  if(c.praise)return pick('praise');
  if(c.long)return pick('long');
  if(c.short)return pick('short');
  if(c.eng)return pick('eng');
  if(c.inter)return pick('inter');
  if(c.idk)return pick('idk');
  if(c.stmt&&Math.random()<.7){const m=mirror(t);return pick('reflect').replace('{M}',m.charAt(0).toUpperCase()+m.slice(1)).replace('{m}',m.charAt(0).toLowerCase()+m.slice(1));}
  if(c.nums.length&&!c.key.length){return pick('num').replace('{n}',c.nums[0]);}
  if(w&&Math.random()<.4)return gen(w);
  if(c.q&&Math.random()<.65)return pick(c.q);
  if(w&&Math.random()<.3)return pick('echo').replace('{w}',w);
  return pick(classify(t));
}

function reply(t){
  count++;setLevel();
  const c=analyze(t);
  let r=core(t,c);
  const w=c.key[0];
  if(c.safeHit){user.asked=false;user.prev=norm(t);return r;}
  if(c.deci||R.num42.includes(r)||R.s67f.includes(r)||R.s67a.includes(r)||R.liebevoll.includes(r)||(c.botq&&c.botq[1].includes(r))){
    user.asked=false;user.prev=norm(t);if(w)user.mem.push(w);recent.push(r);return r;
  }
  if(count>3&&user.mem.length&&Math.random()<.12)r=pick('mem').replace('{old}',rnd(user.mem));
  else if(user.name&&Math.random()<.2)r=pick('namePre').replace('{name}',user.name)+' '+r;
  else if(Math.random()<.18)r=rnd(openers)+' '+r;
  if(annoy>=10&&Math.random()<.4)r=rnd(maxed);
  else if(count%6===0)r=rnd(extra).replace('{n}',count).replace('{k}',100-annoy*10);
  for(let i=0;i<4&&recent.includes(r);i++)r=w?gen(w):pick('rand');
  recent.push(r);if(recent.length>40)recent.shift();
  user.asked=/\?\s*$/.test(r);user.prev=norm(t);if(w)user.mem.push(w);if(user.mem.length>6)user.mem.shift();
  if(annoy>=8&&Math.random()<.5)r=r.toUpperCase();
  if(annoy>=5&&Math.random()<.1)r=rnd(R.slam)+' '+r;
  return r;
}

form.addEventListener('submit',e=>{
  e.preventDefault();
  const t=inp.value.trim();
  if(!t)return;
  add(t,'me');inp.value='';btn.disabled=true;lastAct=Date.now();idleN=0;
  const ty=typingRow();
  const r=reply(t);
  const serious=r===R.safe[0]||R.sad.includes(r);
  setTimeout(()=>{
    ty.remove();add(r,'bot');btn.disabled=false;inp.focus();lastAct=Date.now();
    if(count>=3)document.getElementById('chips').style.display='none';
    if(!serious&&count>2&&annoy>=3&&Math.random()<.22){
      const t2=typingRow();
      setTimeout(()=>{t2.remove();const f=rnd(R.follow);add(f,'bot');user.asked=/\?\s*$/.test(f);lastAct=Date.now();},1700+Math.random()*1200);
    }
  },600+Math.min(1800,r.length*16)+Math.random()*500);
});
setInterval(()=>{
  if(count>0&&idleN<3&&Date.now()-lastAct>35000){add(rnd(R.idle),'bot');idleN++;lastAct=Date.now();}
